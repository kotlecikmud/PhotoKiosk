<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>PhotoKiosk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📷%3C/text%3E%3C/svg%3E">
<style>
  /* Theme colours come from the admin panel (ui_theme) and are inlined for a flash-free first paint */
  :root {
    --bg: {{ colors.bg_dark }};
    --card: {{ colors.bg_card }};
    --card-sel: {{ colors.bg_card_selected }};
    --border: {{ colors.border }};
    --primary: {{ colors.primary }};
    --primary-h: {{ colors.primary_hover }};
    --success: {{ colors.success }};
    --success-h: {{ colors.success_hover }};
    --danger: {{ colors.danger }};
    --danger-h: {{ colors.danger_hover }};
    --text: {{ colors.text }};
    --muted: {{ colors.text_muted }};
  }
</style>
<link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
</head>
<body>
<div id="app"><div class="boot"><div class="spinner"></div></div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script type="module" src="/static/js/main.js?v={{ version }}"></script>
</body>
</html>
